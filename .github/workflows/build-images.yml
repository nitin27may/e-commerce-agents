name: Build Images

# Builds the container images this stack runs on (twelve Python/web, seven .NET), in five build shapes:
#
#   agent   -> agents/python/Dockerfile      (ARG AGENT_NAME + AGENT_PORT)
#   mcp     -> agents/python/Dockerfile.mcp  (ARG MCP_PACKAGE/MCP_DIR/MCP_MODULE/MCP_PORT)
#   web     -> web/Dockerfile                (no build args)
#   db-init -> agents/python/Dockerfile.dbinit (REPO ROOT context; one-shot DB bootstrap job)
#   dotnet  -> agents/dotnet/src/<Project>/Dockerfile (REPO ROOT context; named <service>-dotnet)
#
# The .NET images are what `stack=dotnet` deploys on Azure (docs/azure-deployment.md). They publish for
# linux/amd64 only (Container Apps is amd64; the SDK stage under QEMU is slow and nothing needs arm64),
# and the smoke test starts the container and polls /health instead of importing a Python module.
# scripts/azure/images.tsv lists every image and its build inputs and must match this matrix
# (agents/python/tests/test_infra_bicep.py compares them).
#
# ── This workflow never decides to publish on its own ────────────────────────
#
# It used to push on a semver tag with no dependency on the test suite. GitHub
# Actions has no cross-workflow `needs:`, so `tests.yml` and this file ran in
# parallel and never saw each other -- a tag pushed onto a red commit published
# images, and the tag path ran no tests at all.
#
# Publishing is now caller-driven via `workflow_call`, so the gate lives with
# whoever calls it:
#
#   pull_request  -> this file's own trigger. Build, load, smoke-test, discard.
#                    Never pushes. Fork PRs have no packages:write, so this path
#                    must stay push-free regardless.
#   push to main  -> tests.yml's `publish-main` job, which `needs:` all six
#                    test jobs. Publishes :main and :sha-<7>.
#   version tag   -> release.yml, after a full test re-run AND a human approval
#                    on the `release` environment. Publishes :vX.Y.Z and :latest.
#
# The design and the reason for each piece is in docs/releasing.md.

on:
  pull_request:
    branches: [main]

  workflow_call:
    inputs:
      publish:
        description: "Push images to GHCR"
        type: boolean
        default: false
      tag_mode:
        description: "Which tag set to produce: 'main' or 'release'"
        type: string
        default: main
      version:
        description: "Version tag for tag_mode=release, e.g. v1.1.0"
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      publish:
        description: "Push images to GHCR (escape hatch)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # The group must distinguish *why* the workflow is running, not just the ref.
  #
  # An earlier version collapsed both a manual publish and a pull-request build
  # into the same "-pr" group, because workflow_dispatch defines no `tag_mode`
  # input and the fallback was a constant. Pushing to the PR then cancelled an
  # in-flight publish that had already pushed several of the twelve images —
  # observed, not theoretical.
  #
  #   pull_request      -> ...-pull_request
  #   workflow_dispatch -> ...-workflow_dispatch
  #   workflow_call     -> ...-main / ...-release  (tag_mode wins)
  group: build-images-${{ github.ref }}-${{ inputs.tag_mode || github.event_name }}
  # Only a pull-request build is safe to cancel — a newer push supersedes it and
  # nothing was published. Every publishing path runs to completion, because
  # cancelling mid-matrix leaves some images pushed at the new tag and the rest
  # stale, which is worse than a slow queue. For workflow_call this evaluates
  # against the caller's event (push), so it is false there too.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/nitin27may/e-commerce-agents

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false # build every image even if one fails
      matrix:
        include:
          # ── Agents: one Dockerfile, ARG AGENT_NAME selects the module ──
          - image: orchestrator
            context: ./agents/python
            dockerfile: ./agents/python/Dockerfile
            build_args: |
              AGENT_NAME=orchestrator
              AGENT_PORT=8080
            smoke_module: orchestrator.main
          - image: product-discovery
            context: ./agents/python
            dockerfile: ./agents/python/Dockerfile
            build_args: |
              AGENT_NAME=product_discovery
              AGENT_PORT=8081
            smoke_module: product_discovery.main
          - image: order-management
            context: ./agents/python
            dockerfile: ./agents/python/Dockerfile
            build_args: |
              AGENT_NAME=order_management
              AGENT_PORT=8082
            smoke_module: order_management.main
          - image: pricing-promotions
            context: ./agents/python
            dockerfile: ./agents/python/Dockerfile
            build_args: |
              AGENT_NAME=pricing_promotions
              AGENT_PORT=8083
            smoke_module: pricing_promotions.main
          - image: review-sentiment
            context: ./agents/python
            dockerfile: ./agents/python/Dockerfile
            build_args: |
              AGENT_NAME=review_sentiment
              AGENT_PORT=8084
            smoke_module: review_sentiment.main
          - image: inventory-fulfillment
            context: ./agents/python
            dockerfile: ./agents/python/Dockerfile
            build_args: |
              AGENT_NAME=inventory_fulfillment
              AGENT_PORT=8085
            smoke_module: inventory_fulfillment.main
          # The outbox worker: AGENT_NAME=worker copies worker/ into the image (the
          # Dockerfile copies ${AGENT_NAME}/), compose overrides the command. The smoke
          # import is what catches a worker/ that is missing from the image.
          - image: outbox-worker
            context: ./agents/python
            dockerfile: ./agents/python/Dockerfile
            build_args: |
              AGENT_NAME=worker
              AGENT_PORT=8095
            # Space-separated: the worker imports these lazily to apply an SLA timeout, so
            # importing worker.main alone would pass on an image that cannot do its job.
            smoke_module: worker.main orchestrator.approvals_service orchestrator.modes.workflow_mode
          # auth-server is an agent-shaped image too (AUTH_MODE=oauth path).
          # docker-compose.yml builds it from the same Dockerfile.
          - image: auth-server
            context: ./agents/python
            dockerfile: ./agents/python/Dockerfile
            build_args: |
              AGENT_NAME=auth_server
              AGENT_PORT=8090
            smoke_module: auth_server.main

          # ── MCP servers: separate Dockerfile, uv workspace packages ──
          - image: mcp-product
            context: ./agents/python
            dockerfile: ./agents/python/Dockerfile.mcp
            build_args: |
              MCP_PACKAGE=ecommerce-mcp-product
              MCP_DIR=packages/mcp-product
              MCP_MODULE=ecommerce_mcp_product.server:app
              MCP_PORT=9000
            smoke_module: ecommerce_mcp_product.server
          - image: mcp-inventory
            context: ./agents/python
            dockerfile: ./agents/python/Dockerfile.mcp
            build_args: |
              MCP_PACKAGE=ecommerce-mcp-inventory
              MCP_DIR=packages/mcp-inventory
              MCP_MODULE=ecommerce_mcp_inventory.server:app
              MCP_PORT=9001
            smoke_module: ecommerce_mcp_inventory.server

          # ── DB bootstrap job: repo-root context (needs scripts/ and docker/postgres/) ──
          # Runs as an Azure Container Apps job: migrate, seed if empty, embeddings, ANALYZE.
          - image: db-init
            context: .
            dockerfile: ./agents/python/Dockerfile.dbinit
            build_args: ""
            smoke_module: scripts.db_init scripts.seed scripts.generate_embeddings

          # ── Frontend: Node multi-stage, no build args ──
          # Deliberately no NEXT_PUBLIC_API_URL. The backend address is a
          # runtime variable (ORCHESTRATOR_URL) read by the server-side
          # /api/* proxy, so this image is environment-independent and the
          # same digest runs locally and on Azure.
          - image: frontend
            context: ./web
            dockerfile: ./web/Dockerfile
            build_args: ""
            smoke_module: ""

          # ── .NET stack: one Dockerfile per project, repo-root context ──
          # Names carry a -dotnet suffix so they never collide with the Python image of the same service.
          # smoke_port is the port the image listens on; its /health is polled (no model, no database needed).
          - image: orchestrator-dotnet
            context: .
            dockerfile: ./agents/dotnet/src/ECommerceAgents.Orchestrator/Dockerfile
            build_args: ""
            platforms: linux/amd64
            smoke_module: ""
            smoke_port: "8080"
          - image: product-discovery-dotnet
            context: .
            dockerfile: ./agents/dotnet/src/ECommerceAgents.ProductDiscovery/Dockerfile
            build_args: ""
            platforms: linux/amd64
            smoke_module: ""
            smoke_port: "8081"
          - image: order-management-dotnet
            context: .
            dockerfile: ./agents/dotnet/src/ECommerceAgents.OrderManagement/Dockerfile
            build_args: ""
            platforms: linux/amd64
            smoke_module: ""
            smoke_port: "8082"
          - image: pricing-promotions-dotnet
            context: .
            dockerfile: ./agents/dotnet/src/ECommerceAgents.PricingPromotions/Dockerfile
            build_args: ""
            platforms: linux/amd64
            smoke_module: ""
            smoke_port: "8083"
          - image: review-sentiment-dotnet
            context: .
            dockerfile: ./agents/dotnet/src/ECommerceAgents.ReviewSentiment/Dockerfile
            build_args: ""
            platforms: linux/amd64
            smoke_module: ""
            smoke_port: "8084"
          - image: inventory-fulfillment-dotnet
            context: .
            dockerfile: ./agents/dotnet/src/ECommerceAgents.InventoryFulfillment/Dockerfile
            build_args: ""
            platforms: linux/amd64
            smoke_module: ""
            smoke_port: "8085"
          - image: mcp-inventory-dotnet
            context: .
            dockerfile: ./agents/dotnet/src/ECommerceAgents.Mcp/Dockerfile
            build_args: ""
            platforms: linux/amd64
            smoke_module: ""
            smoke_port: "9001"

    steps:
      - uses: actions/checkout@v7

      # ── Resolve publish intent ───────────────────────────────────────────
      #
      # `pull_request` has no `inputs` context at all, so `inputs.publish` is
      # empty there and this correctly resolves to false. Fork PRs cannot be
      # granted packages:write, so the PR path must never attempt a push.
      - name: Resolve publish flag
        id: publish
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.publish }}" == "true" ]]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Derive image tags ────────────────────────────────────────────────
      #
      # :sha-<7>  immutable, one per commit  (main)
      # :main     rolling tip of main, tests green
      # :vX.Y.Z   immutable release
      # :latest   newest RELEASE -- deliberately not tip of main, because
      #           docker-compose.demo.yml pins it and a first-time visitor
      #           should land on something that passed the full gate.
      #
      # A pre-release tag (any version containing a hyphen, e.g. v1.2.0-rc.1)
      # publishes its own version tag and does NOT move :latest.
      - name: Derive image tags
        id: meta
        run: |
          IMAGE_NAME="${{ env.IMAGE_BASE }}/${{ matrix.image }}"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

          if [[ "${{ inputs.tag_mode }}" == "release" ]]; then
            VERSION="${{ inputs.version }}"
            if [[ -z "$VERSION" ]]; then
              echo "::error::tag_mode=release requires a non-empty version input"
              exit 1
            fi
            if [[ "$VERSION" == *-* ]]; then
              echo "Pre-release ${VERSION}: publishing version tag only, not moving :latest"
              echo "tags=${IMAGE_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"
            else
              echo "tags=${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
            fi
          else
            SHA="${GITHUB_SHA::7}"
            if [[ "${{ steps.publish.outputs.should_push }}" == "true" ]]; then
              echo "tags=${IMAGE_NAME}:main,${IMAGE_NAME}:sha-${SHA}" >> "$GITHUB_OUTPUT"
            else
              # PR builds are loaded locally and discarded; the tag is only a
              # handle for the smoke-test step below.
              echo "tags=${IMAGE_NAME}:pr-${SHA}" >> "$GITHUB_OUTPUT"
            fi
          fi

      # ── Multi-arch only on the publish path ──────────────────────────────
      #
      # `load: true` cannot load a multi-platform image, and the import
      # smoke-test below depends on `load`. So PRs stay amd64-only. Readers on
      # Apple Silicon otherwise get QEMU emulation on a published image, which
      # is why the publish path builds arm64 too -- at roughly 3x build time,
      # acceptable on main, not on every PR.
      - name: Set up QEMU
        if: steps.publish.outputs.should_push == 'true' && matrix.platforms == ''
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.publish.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: ${{ steps.publish.outputs.should_push == 'true' && (matrix.platforms || 'linux/amd64,linux/arm64') || 'linux/amd64' }}
          push: ${{ steps.publish.outputs.should_push == 'true' }}
          load: ${{ steps.publish.outputs.should_push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Without these, each GHCR package page renders empty instead of
          # showing the repository README and the MIT licence.
          labels: |
            org.opencontainers.image.source=https://github.com/nitin27may/e-commerce-agents
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # ── Import smoke-test (PR path only -- needs a locally loaded image) ──
      #
      # Catches the class of break that a unit test never sees: a module that
      # imports fine in the repo but not inside the image, because a dependency
      # was declared in the wrong extra or a path assumption differs.
      - name: Smoke-test ${{ matrix.image }} image
        if: steps.publish.outputs.should_push != 'true' && matrix.smoke_module != ''
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | cut -d',' -f1)
          echo "Testing image: ${IMAGE_TAG}"
          docker run --rm \
            -e DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" \
            -e OPENAI_API_KEY="sk-test" \
            -e JWT_SECRET="test-jwt-secret-32-bytes-padding" \
            -e AGENT_SHARED_SECRET="test-agent-secret-32-bytes-pads" \
            -e AGENT_REGISTRY="{}" \
            -e OTEL_ENABLED="false" \
            -e ENVIRONMENT="test" \
            --entrypoint uv \
            "${IMAGE_TAG}" \
            run --no-project python -c "
          import importlib, sys
          for name in '${{ matrix.smoke_module }}'.split():
              importlib.import_module(name)
              print('[OK] ${{ matrix.image }}: ' + name + ' imports cleanly')
          sys.exit(0)
          "

      # The .NET images have no Python module either. An ASP.NET host that starts and answers /health has
      # loaded its configuration, its dependency graph and its prompts (the Dockerfiles copy the shared YAML in).
      # /health needs no model, but product-discovery checks EMBEDDING_DIM against the stored vector columns at
      # startup (as its Python twin does), so the smoke test gives every .NET image a real pgvector database loaded
      # with the frozen baseline schema, on the host network.
      - name: Smoke-test .NET image
        if: steps.publish.outputs.should_push != 'true' && matrix.smoke_port != ''
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | cut -d',' -f1)
          PORT="${{ matrix.smoke_port }}"
          PGID=$(docker run -d --network host \
            -e POSTGRES_USER=smoke -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=smoke \
            -v "$PWD/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" \
            pgvector/pgvector:pg16)
          for i in $(seq 1 30); do
            docker exec "$PGID" pg_isready -U smoke -d smoke > /dev/null 2>&1 && break
            sleep 2
          done
          CID=$(docker run -d --network host \
            -e ENVIRONMENT="test" \
            -e DATABASE_URL="postgresql://smoke:smoke@localhost:5432/smoke" \
            -e OPENAI_API_KEY="sk-test" \
            -e JWT_SECRET="test-jwt-secret-32-bytes-padding" \
            -e AGENT_SHARED_SECRET="test-agent-secret-32-bytes-pads" \
            -e AGENT_REGISTRY="{}" \
            -e OTEL_ENABLED="false" \
            "${IMAGE_TAG}")
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${PORT}/health" > /dev/null; then
              echo "[OK] ${{ matrix.image }}: /health answered on :${PORT}"
              docker rm -f "$CID" "$PGID" > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error::${{ matrix.image }} did not answer /health on :${PORT} within 60s"
          docker logs "$CID"
          docker rm -f "$CID" "$PGID" > /dev/null
          exit 1

      # The frontend image has no Python module to import. `node server.js` is
      # the standalone Next.js entry point; starting it and getting a listening
      # socket is the equivalent check.
      - name: Smoke-test frontend image
        if: steps.publish.outputs.should_push != 'true' && matrix.image == 'frontend'
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | cut -d',' -f1)
          CID=$(docker run -d -p 3000:3000 "${IMAGE_TAG}")
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "[OK] frontend: server responded"
              docker rm -f "$CID" > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error::frontend image did not respond on :3000 within 60s"
          docker logs "$CID"
          docker rm -f "$CID" > /dev/null
          exit 1

  # A single job the branch protection rule can require, instead of listing every
  # matrix legs by name (which breaks every time the matrix changes).
  build-images-ok:
    name: Build images · all green
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::one or more image builds failed"
            exit 1
          fi
          echo "all images built"
