# Secret scan (gitleaks) on every PR and on main. Reads the checkout only; no secrets are used
# and none may be added (the repo rule: nothing here touches a model-provider key).
# Allowlist for known fixtures: .gitleaks.toml.
#
# The action is pinned by commit SHA (v3.0.0). gitleaks-action needs a GITLEAKS_LICENSE only for
# repos owned by an organisation; this repo is user-owned, so none is configured. If the repo
# moves to an org, replace this step with the gitleaks binary rather than adding a secret.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
