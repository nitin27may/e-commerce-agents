# Dual-stack parity gate, keyless (B2 on EV-2).
#
# Boots the Python stack and the .NET stack, one after the other, under LLM_PROVIDER=replay; drives one dataset
# (evals/datasets/stack_parity.json) through each with the `http` eval target (POST /api/chat/stream, as a seeded
# user); and FAILS when the two stacks' run records diverge: a different outcome, tool-call set, route, workflow
# node set or approval flag, or a mean score further apart than the tolerance (evals/stack_compare.py).
#
# Why this is its own workflow and not a job in compose-smoke.yml. compose-smoke is a matrix of independent boots
# that run in parallel and share nothing; this check needs both stacks' records in one place, so it runs the stacks
# serially in one job (they bind the same host ports anyway) and compares. Keeping it apart also gives it its own
# path filter and its own red/green on a pull request, so "the stacks disagree" is never confused with "a stack
# does not boot". It reuses compose-smoke.sh for the boot (compose files, seeding, /ready, replay env).
#
# What it can and cannot judge, honestly. Under replay a turn that calls a model is a replay miss on every stack
# (the committed fixtures are Python request hashes recorded for an identity with no profile), so the dataset is the
# orchestration modes that call no model: they still run the real route, auth, mode registry, workflow graph and
# database tools on each stack. A model-calling parity run needs a live key and is a human dispatch (see
# docs/agent-quality.md); nothing here spends one. Keyless, no secrets, so a pull_request trigger is safe: the
# first step fails the job if any API key is present, as evals.yml and compose-smoke.yml do.
#
# Demonstrating that it goes red (B2 acceptance): see the header of scripts/stack-parity.sh. A one-line change to
# the .NET stack (rename the `reviews` executor id in PrePurchaseWorkflow.cs) turns this job red, and reverting it
# turns it green. The comparison function's own test is
# agents/python/tests/test_eval_stack_compare.py::test_removing_a_capability_from_one_stack_fails_the_comparison.
name: Stack parity

on:
  pull_request:
    paths:
      - "agents/**"
      - "docker-compose*.yml"
      - "docker/**"
      - "scripts/lib/mixed-env.sh"
      - "scripts/migrate.py"
      - "scripts/seed.py"
      - "scripts/compose-smoke.sh"
      - "scripts/stack-parity.sh"
      - ".github/workflows/stack-parity.yml"
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "docker-compose*.yml"
      - "docker/**"
      - "scripts/stack-parity.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Python vs .NET (replay, keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      # First step, deliberately: no later step can run with a credential in scope.
      - name: Refuse to run with any API key set
        run: |
          leaked="$(env | grep -E '^[A-Za-z0-9_]*(_API_KEY|AZURE_OPENAI_KEY)=.+' | cut -d= -f1 || true)"
          if [ -n "$leaked" ]; then
            echo "::error::credentials present in the environment: $leaked"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: agents/python/uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: agents/python
        run: uv sync --extra dev

      - name: Boot each stack and compare
        env:
          LLM_PROVIDER: replay
          COMPOSE_PROJECT_NAME: eca-stack-parity
          PARITY_OUT: ${{ github.workspace }}/stack-parity-out
        run: scripts/stack-parity.sh --stacks "python dotnet"

      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-parity-records
          path: stack-parity-out/
          if-no-files-found: ignore
