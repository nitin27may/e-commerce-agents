# Build and deploy the documentation site to GitHub Pages.
#
# Adapted from the sibling repos (clean-architecture-docker-dotnet-angular,
# mean-docker), which both publish `docs/` directly with just-the-docs. This one
# differs in a single way that matters: the site is *generated* first.
#
# The static web preview (#301, docs/preview.md) is published by THIS workflow, under /preview of the same
# site: a Pages site has one deployment, so a second workflow deploying it would replace the docs (and be
# replaced by them). The preview is built into the artifact below, after Jekyll, so one deploy carries both.
# .github/workflows/preview.yml only tests the export on pull requests.
#
# `scripts/build_docs_site.py` assembles `_site_src/` from three separate trees
# — docs/, docs/concepts/ and the 38 tutorial chapters — injecting Jekyll front
# matter and rewriting every cross-tree link. That keeps the repository free of
# front matter, which would otherwise render as a metadata table on top of every
# file when read on GitHub. The repo stays the source of truth; the site is a
# rendering of it.
name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tutorials/**"
      - "scripts/build_docs_site.py"
      - "scripts/build_preview_data.py"
      - "web/**"
      - "agents/python/config/demo/tour.yaml"
      - "agents/python/demo/fixtures/**"
      - ".github/workflows/jekyll-gh-pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tutorials/**"
      - "scripts/build_docs_site.py"
      - "scripts/build_preview_data.py"
      - "web/**"
      - "agents/python/config/demo/tour.yaml"
      - "agents/python/demo/fixtures/**"
      - ".github/workflows/jekyll-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress production deploy. Pull request builds get their own group: with one shared
# group, a queued PR run replaced the pending push run, so a merge to main could skip its deploy (the
# docs for #324 were not published until the run was re-run by hand).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Runs on pull requests too, where the deploy job does not. A site whose
      # links rot is worse than no site, and a broken cross-tree link is exactly
      # the kind of thing that only shows up once the trees are merged into one
      # URL space — so it has to fail the PR, not the deploy.
      - name: Check the generated site (front matter, nav parents, links)
        run: python scripts/build_docs_site.py --check

      - name: Generate the site sources
        run: python scripts/build_docs_site.py

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src
          destination: ./_site

      # The static preview: the normal web app built with NEXT_PUBLIC_PREVIEW=1, served from /preview. The data it
      # replays is committed (web/src/lib/preview/preview-data.json); the check below fails a PR that changed
      # the tour, the fixtures or the seed catalog without regenerating it.
      - name: Check the preview data is current
        run: python scripts/build_preview_data.py --check

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build the static preview
        working-directory: web
        env:
          PREVIEW_BASE_PATH: /e-commerce-agents/preview
          NEXT_PUBLIC_SITE_URL: https://nitinksingh.com/e-commerce-agents/preview
        run: pnpm build:preview

      - name: Add the preview to the site
        run: |
          # actions/jekyll-build-pages runs in a container as root, so _site is root-owned.
          sudo chown -R "$USER":"$(id -gn)" _site
          mkdir -p _site/preview
          cp -R web/out/. _site/preview/
          # The preview goes in after Jekyll, so Jekyll never sees (or skips) its _next folder.
          touch _site/preview/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    # Pull requests build and link-check but never publish.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
