name: Evals

# Two jobs, split by cost:
#
# - `replay-regression` ("Replay regression") runs on every PR: every dataset (including
#   orchestrator_routing.json and red_team.json), all against LLM_PROVIDER=replay with
#   deterministic scorers only, compared against evals/baselines/python-inproc-replay/. It gates on fixture
#   misses, deterministic assertions and a score drop against the baseline. Its score is a
#   regression signal about the recorded answers, never a measure of quality. Zero cost, zero
#   credentials — see agents/python/evals/fixtures/README.md for how the
#   cassettes were recorded and why the five specialist services still need
#   to be booted (in replay mode, no key) before the orchestrator/safety
#   suites run: call_specialist_agent makes a real HTTP call independent of
#   LLM_PROVIDER, so those two suites need the services *up*, just not
#   making any real LLM calls.
# - `full` runs on workflow_dispatch ONLY: the live datasets (evals/datasets/live/) against a real
#   model chosen by input (provider, model, repeats, suite, threshold), keys read from repository
#   secrets by name, a Postgres service container, records and a scorecard uploaded as artifacts,
#   and a token ceiling enforced (COST_BUDGET_TOKENS_PER_RUN, LIVE_MAX_TOTAL_TOKENS).
#   This is the one that spends real money.
#
#   It used to also run on a weekly cron. Nothing in this repo may spend a live
#   LLM key on an automatic trigger — a scheduled job bills you on a timer, for
#   a result nobody asked for and (as the 2026-08-24 run showed) nobody reads
#   when it fails. Anything that costs money is started by a human who wants the
#   answer. Keep it that way when adding jobs here.

on:
  pull_request:
    paths:
      - "agents/python/evals/**"
      - "agents/python/shared/**"
      - "agents/python/orchestrator/**"
      - "agents/python/*_discovery/**"
      - "agents/python/*_management/**"
      - "agents/python/*_promotions/**"
      - "agents/python/*_sentiment/**"
      - "agents/python/*_fulfillment/**"
      - "docker/postgres/**"
      - "scripts/migrate.py"
  push:
    branches: [main]
    paths:
      - "agents/python/evals/**"
  # Inputs apply to the `full` job only. The replay job ignores them.
  workflow_dispatch:
    inputs:
      provider:
        description: "Model provider (its secrets must exist in the repository; see evals/README.md)"
        type: choice
        options: [openai, azure, anthropic, openai-compatible]
        default: openai
      model:
        description: "Model name (for azure, the deployment name)"
        type: string
        required: true
        default: gpt-4.1
      repeats:
        description: "Times each case runs (mean and spread are reported)"
        type: string
        default: "1"
      suite:
        description: "all, or one agent"
        type: choice
        options:
          - all
          - product-discovery
          - order-management
          - pricing-promotions
          - review-sentiment
          - inventory-fulfillment
          - orchestrator
        default: all
      pass_threshold:
        description: "Minimum overall score per suite"
        type: string
        default: "0.7"
      use_llm_judge:
        description: "Judge completeness with a model (self-judged unless JUDGE_* is configured)"
        type: boolean
        default: false
      token_budget_per_run:
        description: "COST_BUDGET_TOKENS_PER_RUN, enforced: input plus output tokens one run may use"
        type: string
        default: "100000"
      max_total_tokens:
        description: "Stop starting new suites once this many tokens have been spent in total"
        type: string
        default: "2000000"

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ecommerce:ecommerce_secret@localhost:5432/ecommerce_agents
  REDIS_URL: redis://localhost:6379
  # 'test' keeps the settings validator in warn-mode for placeholder secrets.
  ENVIRONMENT: test
  JWT_SECRET: ci-eval-jwt-secret-please-rotate-32bytes
  AGENT_SHARED_SECRET: ci-eval-agent-secret-please-rotate-32b
  AGENT_REGISTRY: >-
    {"product-discovery":"http://localhost:8081","order-management":"http://localhost:8082",
    "pricing-promotions":"http://localhost:8083","review-sentiment":"http://localhost:8084",
    "inventory-fulfillment":"http://localhost:8085"}
  # The replay-regression job replays frozen model output, so its absolute score is a
  # property of the recording session, not of the pull request under test.
  # What a PR *can* change is measured by --baseline/--max-regression (and by
  # the missing-fixture check, which always fails the run). The quality floor
  # is asserted by the `full` job, which drives real models.
  SMOKE_THRESH: "0"

jobs:
  replay-regression:
    name: Replay regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_secret
          POSTGRES_DB: ecommerce_agents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]

    env:
      LLM_PROVIDER: replay
      REPLAY_FIXTURES_DIR: evals/fixtures/replay

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: agents/python/uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: agents/python
        run: uv sync --extra dev

      # Baseline (docker/postgres/init.sql) + docker/postgres/migrations/*, in order.
      - name: Load database schema
        run: uv run --project agents/python python -m scripts.migrate

      # scripts.seed / scripts.generate_embeddings live at the repo root, not
      # inside agents/python/ — docker-compose's seeder service resolves this
      # via a volume mount (./scripts:/app/scripts:ro) that isn't available
      # here, so these two steps run from the repo root and point uv at the
      # agents/python project explicitly instead.
      # Under LLM_PROVIDER=replay the seeder also populates product_embeddings
      # (replay vectors, then REINDEX) -- no separate generate_embeddings step.
      # Keeping one would delete and reinsert 50 rows after ANALYZE and could
      # trip autovacuum's analyze mid-run, changing semantic_search's plan.
      - name: Seed deterministic demo data
        run: uv run --project agents/python python -m scripts.seed

      # Starts the five specialists (replay mode, no key, no cost), runs every
      # suite against the committed fixtures and baselines, and stops what it
      # started. The same script a human runs locally: scripts/replay-evals.sh.
      - name: Run every suite against replay fixtures + committed baselines
        run: scripts/replay-evals.sh

      # The specialists are started with `nohup ... &` and would otherwise
      # still be running when the job's post steps execute. `setup-uv`'s
      # cache-prune step then hangs on the uv cache those processes hold open
      # and is killed at its 300s timeout, failing the job after all the real
      # work has already succeeded. A job should stop what it starts.
      - name: Stop specialist services
        if: always()
        run: |
          pkill -f "uvicorn .*\.main:app" || true
          sleep 2
          pkill -9 -f "uvicorn .*\.main:app" || true

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-replay-regression
          path: |
            agents/python/eval-*.json
            agents/python/eval-records-*.jsonl
          retention-days: 30


  # The live job. It SPENDS MONEY and runs on workflow_dispatch only; the `if` below repeats the
  # trigger rule at the job, because this file also has pull_request and push triggers.
  # agents/python/tests/test_workflow_secret_triggers.py fails if a job that reads a model key can
  # ever run from an automatic trigger. The work is in scripts/live-evals.sh (one implementation,
  # runnable locally); see agents/python/evals/README.md, "Live runs in CI".
  full:
    name: Live (real LLM, manual dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'
    # One live run at a time: they share a database and ports, and a second one doubles the spend.
    concurrency:
      group: eval-live
      cancel-in-progress: false
    # Cloud OIDC credentials (optional extra): see the commented block before "Run live evals".
    # It needs `id-token: write` here, which is NOT granted by default.
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_secret
          POSTGRES_DB: ecommerce_agents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]

    env:
      LIVE_PROVIDER: ${{ inputs.provider }}
      LIVE_MODEL: ${{ inputs.model }}
      LIVE_REPEATS: ${{ inputs.repeats }}
      LIVE_SUITE: ${{ inputs.suite }}
      LIVE_PASS_THRESHOLD: ${{ inputs.pass_threshold }}
      LIVE_USE_JUDGE: ${{ inputs.use_llm_judge }}
      COST_BUDGET_TOKENS_PER_RUN: ${{ inputs.token_budget_per_run }}
      LIVE_MAX_TOTAL_TOKENS: ${{ inputs.max_total_tokens }}
      # Model keys, by name, from repository secrets. Empty when unset; the script names the missing
      # one for the chosen provider and stops before any model call.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      # Fail first, before anything is installed, when the chosen provider's secret is missing.
      - name: Check provider configuration
        run: scripts/live-evals.sh --check-env

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: agents/python/uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: agents/python
        run: uv sync --extra dev

      # Optional extra: sign in to a cloud with OIDC instead of a stored key (for example Azure OpenAI
      # with managed identity, AZURE_OPENAI_AUTH=identity). Uncomment, add `id-token: write` to the
      # job's permissions, and put the identifiers in repository or environment VARIABLES, never in
      # this file. The Azure workflow (azure.yml) shows the same pattern. Nothing here is required.
      #
      # - name: Cloud login (OIDC)
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ vars.EVAL_OIDC_CLIENT_ID }}
      #     tenant-id: ${{ vars.EVAL_OIDC_TENANT_ID }}
      #     subscription-id: ${{ vars.EVAL_OIDC_SUBSCRIPTION_ID }}

      # Migrate and seed a fresh database, start the specialists the orchestrator suite calls, run the
      # live datasets (evals/datasets/live/) with --records-out, and stop what was started.
      - name: Run live evals
        run: scripts/live-evals.sh --setup

      - name: Build scorecard
        if: always()
        run: python3 scripts/live_eval_scorecard.py agents/python --out agents/python/live-eval-scorecard.md

      - name: Upload records and scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-live
          path: |
            agents/python/eval-live-*.json
            agents/python/eval-records-live-*.jsonl
            agents/python/live-eval-scorecard.md
          retention-days: 30
