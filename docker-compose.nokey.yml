# ============================================================
# E-Commerce Agents — no-key overlay
#
# Plays back recorded model responses, so the stack runs with no API key and
# no network access to a model provider. Layer it on top of either base file:
#
#   docker compose -f docker-compose.demo.yml -f docker-compose.nokey.yml up
#   docker compose -f docker-compose.yml -f docker-compose.nokey.yml \
#                  --profile agents --profile frontend up --build
#
# or let the script pick: ./scripts/dev.sh --demo --no-key   (-Demo -NoKey on PowerShell)
#
# ── Why every value below is a literal ──────────────────────────────────────
#
# The base files read most settings as ${NAME:-default}, which an exported
# shell variable or a line in .env overrides. That is right for a keyed run and
# wrong here: a replay fixture is keyed by a hash of the exact request (every
# message, the agent instructions, the tool schemas and, when set, the response
# format; not the model name or sampling parameters), so anything that changes
# a prompt or a schema -- MCP_ENABLED, the role-aware prompt blocks,
# HANDOFF_AUTONOMOUS_MODE, AGENT_REGISTRY, the guardrail flags -- turns every
# recorded answer into a miss. Literals in an overlay beat the base file's
# interpolation no matter what the caller's shell exports. That is the whole
# point of this file. Do not rewrite them as ${VAR:-...}.
#
# Keys, secrets and ports stay with the base file; nothing here is a secret.
#
# ── Fixtures ────────────────────────────────────────────────────────────────
#
# REPLAY_FIXTURES_DIR points at /app/demo/fixtures/replay inside the image. The
# recordings are not made yet: agents/python/demo/ does not exist and
# agents/python/Dockerfile has no `COPY demo/ demo/` (both arrive together).
# Until then the directory is simply absent, which is a supported state:
# every model call is a replay miss, the orchestrator reports it in chat as a
# prompt that was not recorded, and the stack stays up. Browsing, search, cart
# and checkout never call a model and work either way.
# ============================================================

x-nokey-env: &nokey-env
  LLM_PROVIDER: replay
  LLM_BASE_URL: ""
  LLM_API: responses
  LLM_MODEL: gpt-4.1
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  AZURE_OPENAI_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""
  # Replay vectors, generated by the seeder; the query side uses the same scheme.
  EMBEDDING_PROVIDER: replay
  EMBEDDING_BASE_URL: ""
  EMBEDDING_API_KEY: ""
  EMBEDDING_MODEL: text-embedding-3-small
  EMBEDDING_DIM: "1536"
  REPLAY_FIXTURES_DIR: /app/demo/fixtures/replay
  RECORD: "false"
  DEMO_TOUR_ENABLED: "true"
  # Prompt- and schema-shaping configuration, pinned.
  MCP_ENABLED: "false"
  MCP_AUTH_ENABLED: "false"
  HANDOFF_AUTONOMOUS_MODE: "true"
  ORCHESTRATION_MODE: tool
  GUARDRAILS_ENABLED: "true"
  GUARDRAILS_BLOCK_ON_INJECTION: "false"
  HITL_ENABLED: "true"
  RETURN_HITL_THRESHOLD: "500"
  RETURN_LIFECYCLE_ENABLED: "false"
  AUTONOMY_ENABLED: "false"
  COST_BUDGET_MODE: observe
  AUTH_MODE: local

services:
  # The seeder fills product_embeddings under replay and never calls a model.
  seeder:
    environment:
      <<: *nokey-env

  orchestrator:
    environment:
      <<: *nokey-env
      AGENT_REGISTRY: >-
        {
          "product-discovery": "http://product-discovery:8081",
          "order-management": "http://order-management:8082",
          "pricing-promotions": "http://pricing-promotions:8083",
          "review-sentiment": "http://review-sentiment:8084",
          "inventory-fulfillment": "http://inventory-fulfillment:8085"
        }

  product-discovery:
    environment:
      <<: *nokey-env

  order-management:
    environment:
      <<: *nokey-env

  pricing-promotions:
    environment:
      <<: *nokey-env

  review-sentiment:
    environment:
      <<: *nokey-env

  inventory-fulfillment:
    environment:
      <<: *nokey-env
