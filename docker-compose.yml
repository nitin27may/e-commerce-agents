# ============================================================
# E-Commerce Agents — Docker Compose
# Usage: ./scripts/dev.sh  (or docker compose up --build)
# ============================================================

# Compose project name, set explicitly.
#
# Without it, every compose file in this directory resolves to the same
# project (`e-commerce-agents`, from the folder name) — so the Python and .NET
# stacks shared container names, and `docker compose down` with one file would
# leave the other's containers running as orphans. That is not a hypothetical:
# it is what happens, and the recovery is `docker rm -f`.
#
# Distinct names make each stack independently addressable. They still cannot
# run simultaneously — both publish the same host ports, deliberately — but now
# the failure is a clear port conflict rather than two stacks quietly wearing
# each other's container names. See plan 16 F4.
name: e-commerce-agents

# What every agent container (orchestrator and the five specialists) gets beside its environment:
#   - the pricing directory, read-only at /pricing, so editing agents/python/config/pricing/models.yaml (or adding an
#     overrides file there) takes effect on the next container restart with no image rebuild. PRICING_FILE below points
#     at it; PRICING_OVERRIDES_FILE is yours to set, as a path UNDER /pricing (for example /pricing/overrides.yaml):
#     a host path in .env means nothing inside a container.
#   - host.docker.internal, so a local model server on your machine (Ollama, llama.cpp, vLLM: the run profiles use it)
#     is reachable on Linux too; Docker Desktop provides the name already.
x-agent-runtime: &agent-runtime
  extra_hosts: ["host.docker.internal:host-gateway"]
  volumes:
    - ./agents/python/config/pricing:/pricing:ro

services:
  # ── Infrastructure ─────────────────────────────────────────

  db:
    image: pgvector/pgvector:pg16
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: ecommerce_agents
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ecommerce -d ecommerce_agents"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Aspire Dashboard (OpenTelemetry) ────────────────────────

  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    ports:
      - "127.0.0.1:18888:18888"   # Dashboard UI
      - "127.0.0.1:18890:18889"   # OTLP receiver
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
    # TCP-check the OTLP receiver. Aspire's dashboard image doesn't ship
    # curl/wget so we use bash's /dev/tcp pseudo-device — present in the
    # default `bash` shell of the base image.
    # No healthcheck, deliberately. The dashboard image ships no shell at all
    # (`sh`, `bash`, `curl` and `wget` are all absent), so a CMD-SHELL probe can
    # never run: the old /dev/tcp check reported "unhealthy" on every start.
    # Nothing may wait on `service_healthy` for this service; use
    # `service_started`. Verified against aspire-dashboard:13.6.5.

  # ── Seed Database (runs once, exits) ────────────────────────

  seeder:
    build:
      context: ./agents/python
      args:
        AGENT_NAME: orchestrator
    working_dir: /app
    # Schema first (scripts/migrate.py: baseline + docker/postgres/migrations), then data.
    command: sh -c "uv run --no-project python -m scripts.migrate && uv run --no-project python -m scripts.seed"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./docker/postgres:/app/docker/postgres:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      OAUTH_SEED_KEY: ${OAUTH_SEED_KEY:-dev-oauth-seed-change-me}
      # The seeder fills product_embeddings: replay vectors under
      # LLM_PROVIDER=replay, else scripts/data/product_embeddings.v1.jsonl.gz
      # when its model matches EMBEDDING_MODEL. It never calls an embedding API.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # Embeddings are configured apart from the chat provider (empty provider = follow LLM_PROVIDER).
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
    restart: "no"
    profiles: ["seed"]

  # ── Self-Hosted OAuth2 Authorization Server (optional — AUTH_MODE=oauth) ──
  #
  # Issues RS256 tokens for user login (orchestrator-brokered ROPC),
  # inter-agent A2A (client credentials), and MCP resource access. No
  # external identity provider — the JWKS/token endpoints below are the
  # only auth authority for both this stack and docker-compose.dotnet.yml
  # (which runs its own co-located instance; the two stacks don't share
  # a network). Not required when AUTH_MODE=local (the default).

  auth-server:
    build:
      context: ./agents/python
      args:
        AGENT_NAME: auth_server
        AGENT_PORT: 8090
    ports: ["127.0.0.1:8090:8090"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_RSA_KEY_SIZE: ${AUTH_RSA_KEY_SIZE:-2048}
      AUTH_SIGNING_KEY_ENCRYPTION_KEY: ${AUTH_SIGNING_KEY_ENCRYPTION_KEY:-}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-3600}
      AUTH_KEY_RETIRE_AFTER_SECONDS: ${AUTH_KEY_RETIRE_AFTER_SECONDS:-0}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-604800}
      OAUTH_SEED_KEY: ${OAUTH_SEED_KEY:-dev-oauth-seed-change-me}
      AUTH_SERVER_AUDIENCE: ${AUTH_SERVER_AUDIENCE:-ecommerce-auth-server}
      AUTH_ALLOW_DYNAMIC_REGISTRATION: ${AUTH_ALLOW_DYNAMIC_REGISTRATION:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    profiles: ["agents"]

  # ── Orchestrator (Customer Support Agent) ───────────────────

  orchestrator:
    <<: *agent-runtime
    build:
      context: ./agents/python
      args:
        AGENT_NAME: orchestrator
        AGENT_PORT: 8080
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      product-discovery: { condition: service_healthy }
      order-management: { condition: service_healthy }
      pricing-promotions: { condition: service_healthy }
      review-sentiment: { condition: service_healthy }
      inventory-fulfillment: { condition: service_healthy }
    # /ready (not /health): the service is up AND its database has the migrated
    # schema. Dependents wait on this via `condition: service_healthy` (#102).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

    environment: &agent-env
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      # Which run profile applied this environment (scripts/dev.sh --profile); informational, shown in the startup line.
      RUN_PROFILE: ${RUN_PROFILE:-}
      # Prices come from the mounted directory, not the copy baked into the image. PRICING_OVERRIDES_FILE must be a path
      # under /pricing (see x-agent-runtime above).
      PRICING_FILE: /pricing/models.yaml
      PRICING_OVERRIDES_FILE: ${PRICING_OVERRIDES_FILE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Any OpenAI-compatible endpoint (Ollama, vLLM, OpenRouter, Gemini's
      # compatible API). Empty means the provider's default.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # responses (default) | chat_completions — needed for endpoints with no
      # /responses route. Python stack only; .NET always uses Chat Completions.
      LLM_API: ${LLM_API:-responses}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1}
      # Sampling temperature. The "-" (no colon) matters: LLM_TEMPERATURE= (set, empty) reaches the
      # container empty and omits the option, which gpt-5.x models require; unset keeps 0.2.
      LLM_TEMPERATURE: ${LLM_TEMPERATURE-0.2}
      # Per-process connection pool bounds. asyncpg defaults 5/20.
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-5}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      # LLM_PROVIDER=anthropic (Claude): the key is required then, the model defaults to
      # claude-sonnet-5-5 and LLM_MODEL is ignored for it. Anthropic has no embeddings API, so set
      # EMBEDDING_PROVIDER too or semantic search falls back to full-text. Stub-tested only; no live call yet.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      # Per-run spend ceiling. COST_BUDGET_MODE stays observe: the ceiling is only counted
      # (cost_budget.would_block), never enforced, until you set enforce yourself.
      COST_BUDGET_MODE: ${COST_BUDGET_MODE:-observe}
      COST_BUDGET_USD_PER_RUN: ${COST_BUDGET_USD_PER_RUN:-0.50}
      # Per-run token ceiling (input + output), same mode as the dollar ceiling. Empty = none.
      COST_BUDGET_TOKENS_PER_RUN: ${COST_BUDGET_TOKENS_PER_RUN:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # Embeddings are configured apart from the chat provider (empty provider = follow LLM_PROVIDER).
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-03-01-preview}
      # key (default) | identity: a Microsoft Entra token instead of AZURE_OPENAI_KEY. Needs a managed
      # identity, so it is for Azure hosting; AZURE_CLIENT_ID picks a user-assigned one.
      AZURE_OPENAI_AUTH: ${AZURE_OPENAI_AUTH:-key}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_EMBEDDING_DEPLOYMENT: ${AZURE_EMBEDDING_DEPLOYMENT:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-random-256-bit-key}
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:-agent-internal-shared-secret}
      # OAuth2 (self-hosted auth-server, optional — AUTH_MODE=oauth). Every
      # value here is additive; AUTH_MODE defaults to "local" so none of
      # this changes behavior unless explicitly opted in.
      AUTH_MODE: ${AUTH_MODE:-local}
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_SERVER_JWKS_URL: http://auth-server:8090/.well-known/jwks.json
      AUTH_SERVER_TOKEN_URL: http://auth-server:8090/oauth/token
      AUTH_JWKS_CACHE_TTL: ${AUTH_JWKS_CACHE_TTL:-900}
      AUTH_ORCH_AUDIENCE: ${AUTH_ORCH_AUDIENCE:-ecommerce-orchestrator}
      AUTH_AGENT_AUDIENCE: ${AUTH_AGENT_AUDIENCE:-ecommerce-agents}
      OAUTH_CLIENT_ID: orchestrator
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_SEED_KEY: ${OAUTH_SEED_KEY:-dev-oauth-seed-change-me}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire:18889
      OTEL_SERVICE_NAME: ecommerce.orchestrator
      # Prompt/completion content in GenAI spans is OFF by default (it carries PII);
      # set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true to see it locally.
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-false}
      # Browser origins allowed to call the API directly (NEXT_PUBLIC_API_URL).
      # The default web app uses the same-origin proxy and needs none.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # signup/login/refresh budget per client per minute. Raise it for local
      # Playwright runs, which log in once per test from one address.
      RATE_LIMIT_AUTH_MAX_REQUESTS: ${RATE_LIMIT_AUTH_MAX_REQUESTS:-10}
      RATE_LIMIT_AUTH_IP_MAX_REQUESTS: ${RATE_LIMIT_AUTH_IP_MAX_REQUESTS:-300}
      RATE_LIMIT_TRUSTED_PROXY_HOPS: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:-1}
      # MAF v1 feature flags — defaults preserve existing behaviour. The .NET
      # compose set these from day one; the Python compose was missing them
      # so toggling RETURN_HITL_THRESHOLD / etc. required editing the
      # running container. (Audit fix #6.)
      MAF_SESSION_BACKEND: ${MAF_SESSION_BACKEND:-postgres}
      # B-15: keep only the last N message groups of rehydrated history. 0 = off.
      HISTORY_COMPACTION_KEEP_LAST_GROUPS: ${HISTORY_COMPACTION_KEEP_LAST_GROUPS:-0}
      MAF_CHECKPOINT_BACKEND: ${MAF_CHECKPOINT_BACKEND:-postgres}
      ORCHESTRATION_MODE: ${ORCHESTRATION_MODE:-tool}
      RETURN_HITL_THRESHOLD: ${RETURN_HITL_THRESHOLD:-500}
      HANDOFF_AUTONOMOUS_MODE: ${HANDOFF_AUTONOMOUS_MODE:-true}
      # Which wire the orchestrator speaks to a specialist: the original /message:send +
      # /message:stream pair (legacy) or A2A 1.0 JSON-RPC at /a2a/v1 (a2a). See docs/a2a.md.
      A2A_TRANSPORT: ${A2A_TRANSPORT:-legacy}
      # Event autonomy (#94): off by default. The simulator route lives on the orchestrator, the handler on the worker.
      AUTONOMY_ENABLED: ${AUTONOMY_ENABLED:-false}
      AUTONOMY_SIMULATOR_ENABLED: ${AUTONOMY_SIMULATOR_ENABLED:-false}
      # How a specialist learns which user a call is for: headers | both (default) | token. `both` sends and
      # verifies a signed, short-lived X-User-Context token and still accepts the headers; see docs/a2a.md.
      # The key is shared by every process on both stacks; empty means AGENT_SHARED_SECRET.
      A2A_IDENTITY: ${A2A_IDENTITY:-both}
      A2A_IDENTITY_KEY: ${A2A_IDENTITY_KEY:-}
      A2A_IDENTITY_TTL_SECONDS: ${A2A_IDENTITY_TTL_SECONDS:-300}
      AGENT_REGISTRY: >-
        {
          "product-discovery": "http://product-discovery:8081",
          "order-management": "http://order-management:8082",
          "pricing-promotions": "http://pricing-promotions:8083",
          "review-sentiment": "http://review-sentiment:8084",
          "inventory-fulfillment": "http://inventory-fulfillment:8085"
        }
    profiles: ["agents"]

  # ── Specialist Agents ──────────────────────────────────────

  product-discovery:
    <<: *agent-runtime
    build:
      context: ./agents/python
      args: { AGENT_NAME: product_discovery, AGENT_PORT: 8081 }
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      db: { condition: service_healthy }
    # /ready (not /health): the service is up AND its database has the migrated
    # schema. Dependents wait on this via `condition: service_healthy` (#102).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.product-discovery
      OAUTH_CLIENT_ID: product-discovery
      # MCP integration (optional — off by default; enable with the mcp
      # profile's mcp-product service also running).
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      MCP_PRODUCT_SERVER_URL: http://mcp-product:9000/mcp
      MCP_PRODUCT_AUDIENCE: ${MCP_PRODUCT_AUDIENCE:-mcp-product}
      MCP_PRODUCT_REQUIRED_SCOPE: ${MCP_PRODUCT_REQUIRED_SCOPE:-mcp:product}
    profiles: ["agents"]

  order-management:
    <<: *agent-runtime
    build:
      context: ./agents/python
      args: { AGENT_NAME: order_management, AGENT_PORT: 8082 }
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      db: { condition: service_healthy }
    # /ready (not /health): the service is up AND its database has the migrated
    # schema. Dependents wait on this via `condition: service_healthy` (#102).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.order-management
      OAUTH_CLIENT_ID: order-management
    profiles: ["agents"]

  pricing-promotions:
    <<: *agent-runtime
    build:
      context: ./agents/python
      args: { AGENT_NAME: pricing_promotions, AGENT_PORT: 8083 }
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      db: { condition: service_healthy }
    # /ready (not /health): the service is up AND its database has the migrated
    # schema. Dependents wait on this via `condition: service_healthy` (#102).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.pricing-promotions
      OAUTH_CLIENT_ID: pricing-promotions
    profiles: ["agents"]

  review-sentiment:
    <<: *agent-runtime
    build:
      context: ./agents/python
      args: { AGENT_NAME: review_sentiment, AGENT_PORT: 8084 }
    ports: ["127.0.0.1:8084:8084"]
    depends_on:
      db: { condition: service_healthy }
    # /ready (not /health): the service is up AND its database has the migrated
    # schema. Dependents wait on this via `condition: service_healthy` (#102).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.review-sentiment
      OAUTH_CLIENT_ID: review-sentiment
    profiles: ["agents"]

  inventory-fulfillment:
    <<: *agent-runtime
    build:
      context: ./agents/python
      args: { AGENT_NAME: inventory_fulfillment, AGENT_PORT: 8085 }
    ports: ["127.0.0.1:8085:8085"]
    depends_on:
      db: { condition: service_healthy }
    # /ready (not /health): the service is up AND its database has the migrated
    # schema. Dependents wait on this via `condition: service_healthy` (#102).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.inventory-fulfillment
      OAUTH_CLIENT_ID: inventory-fulfillment
      # MCP integration (optional — off by default; enable with the mcp
      # profile's mcp-inventory service also running).
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      MCP_INVENTORY_SERVER_URL: http://mcp-inventory:9001/mcp
      MCP_INVENTORY_AUDIENCE: ${MCP_INVENTORY_AUDIENCE:-mcp-inventory}
      MCP_INVENTORY_REQUIRED_SCOPE: ${MCP_INVENTORY_REQUIRED_SCOPE:-mcp:inventory}
    profiles: ["agents"]

  # ── Outbox worker (approval reminders, SLA escalation, timeouts) ──
  #
  # Drains the outbox table; see docs/approvals.md. Same Python agent image,
  # different command. Publishes no port. Waits for the seeder when it is part of this run
  # (it applies the migrations); it also retries until the schema exists.
  outbox-worker:
    build:
      context: ./agents/python
      args: { AGENT_NAME: worker, AGENT_PORT: 8095 }
    command: uv run --no-project python -m worker.main
    depends_on:
      db: { condition: service_healthy }
      seeder: { condition: service_completed_successfully, required: false }
    # No port: the worker touches a heartbeat file every loop; healthy = it was touched in the last 2 minutes.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/outbox-worker.heartbeat -mmin -2 | grep -q . || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # false: the process stays up and idle and drains nothing.
      OUTBOX_WORKER_ENABLED: ${OUTBOX_WORKER_ENABLED:-true}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-2}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-120}
      AUTONOMY_ENABLED: ${AUTONOMY_ENABLED:-false}
    profiles: ["agents"]

  # ── MCP Servers (optional — enable with MCP_ENABLED=true) ──────
  #
  # Each server is a standalone publishable package under packages/.
  # Built with Dockerfile.mcp which installs only that package's deps,
  # keeping the image lean and independent of the main agent application.

  # Product Discovery MCP server — product search, details, comparison,
  # trending products, and price history via MCP streamable HTTP.
  mcp-product:
    build:
      context: ./agents/python
      dockerfile: Dockerfile.mcp
      args:
        MCP_PACKAGE: ecommerce-mcp-product
        MCP_DIR: packages/mcp-product
        MCP_MODULE: ecommerce_mcp_product.server:app
        MCP_PORT: 9000
    ports: ["127.0.0.1:9000:9000"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      # OAuth 2.1 resource-server mode (optional — off by default).
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_SERVER_JWKS_URL: http://auth-server:8090/.well-known/jwks.json
      MCP_PRODUCT_AUDIENCE: ${MCP_PRODUCT_AUDIENCE:-mcp-product}
      MCP_PRODUCT_REQUIRED_SCOPE: ${MCP_PRODUCT_REQUIRED_SCOPE:-mcp:product}
      MCP_PRODUCT_RESOURCE_URL: http://localhost:9000/mcp
    healthcheck:
      # When MCP_AUTH_ENABLED=true, /mcp is wrapped in RequireAuthMiddleware
      # and always 401s — probe the SDK's auto-mounted, unauthenticated
      # protected-resource metadata endpoint instead.
      test:
        [
          "CMD-SHELL",
          "if [ \"$$MCP_AUTH_ENABLED\" = \"true\" ]; then curl -sf http://localhost:9000/.well-known/oauth-protected-resource/mcp; else curl -sf http://localhost:9000/mcp; fi",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["mcp"]

  # Inventory & Fulfillment MCP server — stock levels, warehouses, shipping, carriers.
  mcp-inventory:
    build:
      context: ./agents/python
      dockerfile: Dockerfile.mcp
      args:
        MCP_PACKAGE: ecommerce-mcp-inventory
        MCP_DIR: packages/mcp-inventory
        MCP_MODULE: ecommerce_mcp_inventory.server:app
        MCP_PORT: 9001
    ports: ["127.0.0.1:9001:9001"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      # OAuth 2.1 resource-server mode (optional — off by default).
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_SERVER_JWKS_URL: http://auth-server:8090/.well-known/jwks.json
      MCP_INVENTORY_AUDIENCE: ${MCP_INVENTORY_AUDIENCE:-mcp-inventory}
      MCP_INVENTORY_REQUIRED_SCOPE: ${MCP_INVENTORY_REQUIRED_SCOPE:-mcp:inventory}
      MCP_INVENTORY_RESOURCE_URL: http://localhost:9001/mcp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ \"$$MCP_AUTH_ENABLED\" = \"true\" ]; then curl -sf http://localhost:9001/.well-known/oauth-protected-resource/mcp; else curl -sf http://localhost:9001/mcp; fi",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["mcp"]

  # ── Frontend ────────────────────────────────────────────────

  frontend:
    build:
      context: ./web
    ports: ["3000:3000"]
    environment:
      # Server-side, not NEXT_PUBLIC_*: the browser calls the frontend's own
      # origin and Next forwards from there, so this is a container-network
      # address rather than a host-published one.
      ORCHESTRATOR_URL: http://orchestrator:8080
      # Reverse proxies YOU run in front of this container that append to
      # X-Forwarded-For (0 = none, the published-port default). Leave at 0
      # unless one exists: Next cannot tell a real client address from a forged
      # header. See docs/configuration.md.
      WEB_TRUSTED_PROXY_HOPS: ${WEB_TRUSTED_PROXY_HOPS:-0}
    depends_on:
      orchestrator: { condition: service_healthy }
    profiles: ["frontend"]

volumes:
  pgdata:
