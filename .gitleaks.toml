# Extends gitleaks' default ruleset; only fixtures that were found by a local run are allowed.
# Do not widen these: a new hit is meant to fail the check and be looked at.
#
# Uses the singular [allowlist] table on purpose. CI pins gitleaks 8.24.3, which does not read the
# [[allowlists]] array form added in 8.25; the singular table is read by every version. In this form a
# finding is allowed when its file path OR its secret text matches.
title = "e-commerce-agents gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known test fixtures and sentinels"
paths = [
  # Signed user-context token test vectors (HS256 tokens signed with a published test key); both stacks assert on them.
  '''agents/python/config/identity/testdata/user-context\.v1\.json''',
  # The doctor's redaction tests hold fake key and password values on purpose, to prove it never prints them.
  '''agents/python/tests/test_doctor\.py''',
  # Test fixtures: a throwaway environment value and fake return-label tokens.
  '''agents/python/tests/test_db_init\.py''',
  '''agents/python/tests/test_return_label_token\.py''',
  '''agents/python/tests/test_return_label_entropy\.py''',
  '''agents/dotnet/tests/ECommerceAgents\.Orchestrator\.Tests/ReturnLabelTokenTests\.cs''',
  '''agents/dotnet/tests/ECommerceAgents\.Orchestrator\.Tests/ReturnLabelRouteTests\.cs''',
  # Customer-confirmation test vector: its "key" values are sha256 hex digests of tool arguments (generic-api-key look-alikes), not secrets.
  # This singular [allowlist] form cannot scope by rule id, so the scope is this one file.
  '''agents/python/config/policies/testdata/customer-confirmation\.v1\.json''',
  # The community-results validator's tests plant fake AWS and API keys on purpose, to prove it refuses them.
  '''agents/python/tests/test_eval_community\.py''',
]
regexes = [
  # Throwaway JWT secret for the container smoke test in build-images.yml.
  '''test-jwt-secret-32-bytes-padding''',
  # Azure built-in role definition ids (Key Vault Secrets User and Secrets Officer): public, not secrets.
  '''4633458b-17de-408a-b874-0f5e9c3b6f6c''',
  '''b86a8fe4-44ce-4948-aee5-eccb2c155cd7''',
  # Cognitive Services OpenAI User and Azure AI User built-in role definition ids (app-identities, foundry-project).
  '''5e0bd9bd-7b93-4f28-af87-19fc36ad61bd''',
  '''53ca6127-db72-4b80-b1b0-d745d6d5456d''',
]
