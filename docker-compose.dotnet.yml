# ============================================================
# E-Commerce Agents — Docker Compose (.NET stack)
# Usage: docker compose -f docker-compose.dotnet.yml up --build
# ============================================================
# Mirrors docker-compose.yml but substitutes .NET agents for the Python
# agents. Infrastructure (Postgres, Redis, Aspire, seeder, frontend) and
# environment contract are identical so the Next.js frontend works against
# either stack; each compose file points the frontend at its own
# orchestrator through ORCHESTRATOR_URL.
#
# Dockerfiles now exist for the orchestrator, all 5 specialists, and the
# MCP host (agents/dotnet/src/ECommerceAgents.*/Dockerfile) — the .NET stack
# builds and runs standalone via `--profile agents --profile mcp --profile
# seed`. Note: only one MCP host exists on the .NET side (mirrors Python's
# mcp-inventory; there's no .NET equivalent of mcp-product yet).
# ============================================================

# Compose project name, set explicitly.
#
# Without it, every compose file in this directory resolves to the same
# project (`e-commerce-agents`, from the folder name) — so the Python and .NET
# stacks shared container names, and `docker compose down` with one file would
# leave the other's containers running as orphans. That is not a hypothetical:
# it is what happens, and the recovery is `docker rm -f`.
#
# Distinct names make each stack independently addressable. They still cannot
# run simultaneously — both publish the same host ports, deliberately — but now
# the failure is a clear port conflict rather than two stacks quietly wearing
# each other's container names. See plan 16 F4.
name: e-commerce-agents-dotnet

services:
  # ── Infrastructure ─────────────────────────────────────────

  db:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ecommerce_agents
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_secret
    volumes:
      - pgdata-dotnet:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ecommerce -d ecommerce_agents"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - "18888:18888"
      - "18890:18889"
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/18889 && echo ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Seeder (reuses the Python script; single source of truth) ──

  seeder:
    build:
      context: ./agents/python
      args:
        AGENT_NAME: orchestrator
    working_dir: /app
    command: uv run --no-project python -m scripts.seed
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      OAUTH_SEED_KEY: ${OAUTH_SEED_KEY:-dev-oauth-seed-change-me}
    restart: "no"
    profiles: ["seed"]

  # ── Self-Hosted OAuth2 Authorization Server (optional — AUTH_MODE=oauth) ──
  #
  # Same Python auth_server image used by docker-compose.yml — this stack
  # doesn't share a network with the Python compose project, so it gets its
  # own co-located instance (own Postgres, own signing key). Seeded
  # client_ids/secrets are identical across both stacks since both derive
  # from the same OAUTH_SEED_KEY. Not required when AUTH_MODE=local (the
  # default).

  auth-server:
    build:
      context: ./agents/python
      args:
        AGENT_NAME: auth_server
        AGENT_PORT: 8090
    ports: ["8090:8090"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_RSA_KEY_SIZE: ${AUTH_RSA_KEY_SIZE:-2048}
      AUTH_SIGNING_KEY_ENCRYPTION_KEY: ${AUTH_SIGNING_KEY_ENCRYPTION_KEY:-}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-3600}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-604800}
      OAUTH_SEED_KEY: ${OAUTH_SEED_KEY:-dev-oauth-seed-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    profiles: ["agents"]

  # ── Orchestrator (.NET) ────────────────────────────────────

  orchestrator:
    build:
      context: .
      dockerfile: agents/dotnet/src/ECommerceAgents.Orchestrator/Dockerfile
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      aspire: { condition: service_started }
    environment: &agent-env
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=ecommerce_agents;Username=ecommerce;Password=ecommerce_secret
      ConnectionStrings__Redis: redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-03-01-preview}
      AZURE_EMBEDDING_DEPLOYMENT: ${AZURE_EMBEDDING_DEPLOYMENT:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-random-256-bit-key}
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:-agent-internal-shared-secret}
      # OAuth2 (self-hosted auth-server, optional — AUTH_MODE=oauth). Every
      # value here is additive; AUTH_MODE defaults to "local" so none of
      # this changes behavior unless explicitly opted in.
      AUTH_MODE: ${AUTH_MODE:-local}
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_SERVER_JWKS_URL: http://auth-server:8090/.well-known/jwks.json
      AUTH_SERVER_TOKEN_URL: http://auth-server:8090/oauth/token
      AUTH_JWKS_CACHE_TTL: ${AUTH_JWKS_CACHE_TTL:-900}
      AUTH_ORCH_AUDIENCE: ${AUTH_ORCH_AUDIENCE:-ecommerce-orchestrator}
      AUTH_AGENT_AUDIENCE: ${AUTH_AGENT_AUDIENCE:-ecommerce-agents}
      OAUTH_CLIENT_ID: orchestrator
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_SEED_KEY: ${OAUTH_SEED_KEY:-dev-oauth-seed-change-me}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire:18889
      OTEL_SERVICE_NAME: ecommerce.orchestrator.dotnet
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-true}
      # New optional MAF feature flags (defaults preserve existing behavior)
      MAF_SESSION_BACKEND: ${MAF_SESSION_BACKEND:-postgres}
      MAF_CHECKPOINT_BACKEND: ${MAF_CHECKPOINT_BACKEND:-postgres}
      RETURN_HITL_THRESHOLD: ${RETURN_HITL_THRESHOLD:-500}
      HANDOFF_AUTONOMOUS_MODE: ${HANDOFF_AUTONOMOUS_MODE:-true}
      AGENT_REGISTRY: >-
        {
          "product-discovery": "http://product-discovery:8081",
          "order-management": "http://order-management:8082",
          "pricing-promotions": "http://pricing-promotions:8083",
          "review-sentiment": "http://review-sentiment:8084",
          "inventory-fulfillment": "http://inventory-fulfillment:8085"
        }
    profiles: ["agents"]

  # ── Specialist Agents (.NET) ───────────────────────────────

  product-discovery:
    build:
      context: .
      dockerfile: agents/dotnet/src/ECommerceAgents.ProductDiscovery/Dockerfile
    ports: ["8081:8081"]
    depends_on:
      db: { condition: service_healthy }
      aspire: { condition: service_started }
    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.product-discovery.dotnet
      OAUTH_CLIENT_ID: product-discovery
    profiles: ["agents"]

  order-management:
    build:
      context: .
      dockerfile: agents/dotnet/src/ECommerceAgents.OrderManagement/Dockerfile
    ports: ["8082:8082"]
    depends_on:
      db: { condition: service_healthy }
      aspire: { condition: service_started }
    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.order-management.dotnet
      OAUTH_CLIENT_ID: order-management
    profiles: ["agents"]

  pricing-promotions:
    build:
      context: .
      dockerfile: agents/dotnet/src/ECommerceAgents.PricingPromotions/Dockerfile
    ports: ["8083:8083"]
    depends_on:
      db: { condition: service_healthy }
      aspire: { condition: service_started }
    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.pricing-promotions.dotnet
      OAUTH_CLIENT_ID: pricing-promotions
    profiles: ["agents"]

  review-sentiment:
    build:
      context: .
      dockerfile: agents/dotnet/src/ECommerceAgents.ReviewSentiment/Dockerfile
    ports: ["8084:8084"]
    depends_on:
      db: { condition: service_healthy }
      aspire: { condition: service_started }
    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.review-sentiment.dotnet
      OAUTH_CLIENT_ID: review-sentiment
    profiles: ["agents"]

  inventory-fulfillment:
    build:
      context: .
      dockerfile: agents/dotnet/src/ECommerceAgents.InventoryFulfillment/Dockerfile
    ports: ["8085:8085"]
    depends_on:
      db: { condition: service_healthy }
      aspire: { condition: service_started }
    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.inventory-fulfillment.dotnet
      OAUTH_CLIENT_ID: inventory-fulfillment
    profiles: ["agents"]

  # ── MCP server (.NET) ──────────────────────────────────────
  # Mirrors Python's mcp-inventory (stock levels, warehouses, shipping,
  # carriers) — there is no .NET equivalent of mcp-product yet.

  mcp-inventory:
    build:
      context: .
      dockerfile: agents/dotnet/src/ECommerceAgents.Mcp/Dockerfile
    ports: ["9001:9001"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=ecommerce_agents;Username=ecommerce;Password=ecommerce_secret
      # OAuth 2.1 resource-server mode (optional — off by default).
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_SERVER_JWKS_URL: http://auth-server:8090/.well-known/jwks.json
      MCP_INVENTORY_AUDIENCE: ${MCP_INVENTORY_AUDIENCE:-mcp-inventory}
      MCP_INVENTORY_REQUIRED_SCOPE: ${MCP_INVENTORY_REQUIRED_SCOPE:-mcp:inventory}
      MCP_INVENTORY_RESOURCE_URL: http://localhost:9001/mcp
    profiles: ["mcp"]

  # ── Frontend (same Next.js; points at .NET backend on :8080) ──

  frontend:
    build:
      context: ./web
    ports: ["3000:3000"]
    environment:
      # Server-side, so this is the container-network address. NEXT_PUBLIC_*
      # is gone: nothing about the backend is compiled into the bundle any
      # more, which is why a dual-stack run no longer needs to rebuild this
      # image to change backends.
      ORCHESTRATOR_URL: http://orchestrator:8080
    depends_on:
      orchestrator: { condition: service_started }
    profiles: ["frontend"]

volumes:
  pgdata-dotnet:
