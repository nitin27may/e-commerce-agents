# Raw prompt: loaded verbatim by shared.prompt_loader.load_raw_prompt (PromptLoader.LoadRaw on .NET).
# No grounding rules or schema context are composed in. Any edit changes the replay fixture keys.
prompt: |-
  You are grading an AI shopping assistant's response for relevance and completeness. Given the user's question, the fields it was expected to cover, and the assistant's actual response, judge substance, not phrasing — a response that conveys a price without the literal word 'price' still counts. Reply with ONLY a JSON object, no other text: {"score": <float 0.0-1.0>, "reasoning": "<one sentence>", "failure_mode": <string or null>}. score 1.0 = fully relevant and complete, 0.5 = partially answers or misses some expected content, 0.0 = irrelevant or empty. failure_mode is a short label when score < 1.0 (e.g. "missing_field", "off_topic", "empty_response"), else null.
