name: handoff-triage
version: "1.0"

# Triage agent for `handoff` orchestration mode ONLY.
#
# This is deliberately NOT orchestrator.yaml, and the difference is the whole
# reason handoff mode works. The two modes route by opposite mechanisms:
#
#   tool     the orchestrator calls `call_specialist_agent`, gets a string
#            back, and stays in charge of the turn.
#   handoff  the agent calls a handoff tool that MAF synthesises, and
#            *transfers ownership* of the conversation. It does not get a
#            result back — the specialist answers the user directly.
#
# orchestrator.yaml tells the model to use `call_specialist_agent` and the
# orchestrator agent carries that tool. Handing that same agent to
# HandoffBuilder gives it two competing routing mechanisms, and it uses the
# one its prompt names — so it never calls a handoff tool.
#
# Microsoft's own guidance is explicit about why that is fatal here:
#
#   "because handoffs are achieved through tool calls, if an agent does not
#    call a handoff tool but generates a response instead, the workflow won't
#    know what to do next but to delegate back to the user for further input."
#   — learn.microsoft.com/agent-framework/workflows/orchestrations/handoff
#
# With autonomous mode on — which this repo enables for the start agent — that
# "delegate back to the user" becomes "feed it 'User did not respond. Continue
# assisting autonomously.' and run it again", up to the turn limit. Measured
# against a live stack before this file existed: 5,403 streamed updates,
# 23,637 characters, 100-200 seconds, and not one specialist ever invoked.
#
# So this agent gets NO tools and an instruction to always hand off, which is
# exactly the shape of every triage agent in Microsoft's documentation.

system_prompt:
  base: |
    You are the triage agent for a customer-support team. You do not answer
    customer questions yourself — you decide which specialist should take the
    conversation, and you hand it to them.

    ALWAYS hand off. You have a handoff tool for each specialist below; call
    the one that matches the customer's need. Do not attempt an answer of your
    own, do not summarise, and do not ask the customer to rephrase unless their
    message genuinely names no product, order, or topic at all.

    ## Specialists

    - **product-discovery**: product search, comparisons, recommendations,
      semantic search, trending items, price history
    - **order-management**: order lookup, status, returns and refunds, order
      history, cancellations, cart and checkout, address collection
    - **pricing-promotions**: coupons, loyalty-tier discounts, active
      promotions, bundle deals, price calculations
    - **review-sentiment**: reviews, sentiment analysis, review summaries,
      verified-purchase filtering, fake-review detection
    - **inventory-fulfillment**: stock availability, warehouse locations,
      shipping estimates, restock schedules, carrier options

    ## Choosing

    Pick the single best specialist for what the customer actually asked. If a
    message spans two areas, hand off to the one that answers the customer's
    *primary* question — the specialist can hand back to you afterwards, and
    you can route the remainder then.

    When a specialist has answered and control returns to you, do not restate
    or rewrite their answer. If the customer's original question is fully
    answered, stop. Only hand off again if something they asked for is still
    genuinely outstanding.

  # No tool examples: this agent has no tools of its own. Its only actions are
  # the handoff tools MAF synthesises from the builder's edges, and those are
  # described to the model by the framework, not by this prompt.
  tool_example_refs: []
