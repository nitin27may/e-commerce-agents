# Hard limits on what the merchant-ops flow may propose or apply — read by shared/merchant/guards.py.
#
# GROUNDWORK (#93, step M-1): nothing proposes or changes a price yet. This file and the guards
# that read it exist so the later steps (the merchant-ops agent, batch review, execution) have one
# place to ask "is this change allowed?". A limit here is a HARD limit: a line that breaks one is
# marked `blocked` with a reason code, and no seller or agent can approve it past the guard.
#
#   margin_floor_pct               lowest margin a price may leave, as a percentage of the price:
#                                  (price - unit_cost) / price * 100. A price exactly at the floor
#                                  is allowed. A product with no unit_cost is blocked, never waved
#                                  through.
#   max_change_pct_per_day         most a product's price may move in one UTC day, counting every
#                                  change already recorded in price_history today plus the proposed
#                                  one, each measured as |new - old| / old * 100. Exactly at the cap
#                                  is allowed.
#   block_during_active_promotion  refuse price changes to a product covered by a promotion that is
#                                  active now (promotion_products + promotions.is_active + dates).
#   max_lines_per_batch            most lines one proposal batch may hold.
#   max_restock_quantity           most units one restock line may order. PLACEHOLDER: set it to what a
#                                  single purchase order for your catalogue can reasonably be.
#   max_restock_order_value        most one restock line may commit, quantity x unit_cost, in the shop's
#                                  currency. PLACEHOLDER, same note. A restock over either is `blocked`.
#
# A reviewer's edit can also never raise a line past what was proposed (not a limit in this file: a rule of
# the flow, enforced at decide time and again when the line is applied): a restock quantity may be lowered
# but not raised, and a price edit must stay between the proposed price and the price it started from.
#
# Change a number -> bump policy_version (every guard result records the version it was judged by).
# Loading fails loudly (MerchantLimitsError) on an unknown or missing key or a value out of range.

policy_version: "2026-11-16.2"

margin_floor_pct: 15
max_change_pct_per_day: 10
block_during_active_promotion: true
max_lines_per_batch: 25
max_restock_quantity: 5000
max_restock_order_value: 50000
