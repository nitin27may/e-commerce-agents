# Golden cases for config/policies/autonomy.yaml (Python only, tests/test_autonomy_policy.py).
#
#   tier_cases    facts -> the tier and the rule that chose it. A fact left out is unknown; an unknown fact never
#                 satisfies a condition, so it can only fall through towards needs_approval.
#   budget_cases  an amount drawn on top of some usage -> allowed, or the caps that trip (exactly at a cap is allowed).
#   credit_cases  a delay in days -> the credit it earns (null below the minimum).
#   risk_score_cases    facts of an order -> the risk score order.risk_flagged gives it (signals add up, capped at 100).
#   damage_cases        a damaged quantity's value and whether it is in stock -> the remedy order.item_damaged picks.
#   month_cases         a day -> the first day of its UTC month and of the next (the month budget cap's window).
#
# A tier case may also say `hold: true|false` under expect (only a risk review's needs_approval rule holds).
#
# Every rule of every action must be hit by a tier case; the tests enforce it.

tier_cases:
  - name: "a 3-day delay with a 5 credit acts alone"
    action: goodwill_credit
    facts: { amount: 5, delay_days: 3, order_total: 80 }
    expect: { tier: auto, rule: auto-small-credit }
  - name: "a credit of exactly 10 is still auto"
    action: goodwill_credit
    facts: { amount: 10, delay_days: 2 }
    expect: { tier: auto, rule: auto-small-credit }
  - name: "a 10.01 credit is no longer auto"
    action: goodwill_credit
    facts: { amount: 10.01, delay_days: 6 }
    expect: { tier: auto_notify, rule: notify-medium-credit }
  - name: "a 15 credit after 6 days acts alone and tells staff"
    action: goodwill_credit
    facts: { amount: 15, delay_days: 6 }
    expect: { tier: auto_notify, rule: notify-medium-credit }
  - name: "a credit of exactly 25 acts alone and tells staff"
    action: goodwill_credit
    facts: { amount: 25, delay_days: 7 }
    expect: { tier: auto_notify, rule: notify-medium-credit }
  - name: "a 25.01 credit needs approval"
    action: goodwill_credit
    facts: { amount: 25.01, delay_days: 7 }
    expect: { tier: needs_approval, rule: default-approval }
  - name: "a 40 credit needs approval"
    action: goodwill_credit
    facts: { amount: 40, delay_days: 12 }
    expect: { tier: needs_approval, rule: default-approval }
  - name: "a 15 credit for a 3-day delay is not auto and not notify-eligible"
    action: goodwill_credit
    facts: { amount: 15, delay_days: 3 }
    expect: { tier: needs_approval, rule: default-approval }
  - name: "an unknown delay never acts alone"
    action: goodwill_credit
    facts: { amount: 5 }
    expect: { tier: needs_approval, rule: default-approval }
  - name: "an unknown amount never acts alone"
    action: goodwill_credit
    facts: { delay_days: 9 }
    expect: { tier: needs_approval, rule: default-approval }
  - name: "no facts at all needs approval"
    action: goodwill_credit
    facts: {}
    expect: { tier: needs_approval, rule: default-approval }
  - name: "a delay under 2 days is not auto even for a tiny credit"
    action: goodwill_credit
    facts: { amount: 1, delay_days: 1 }
    expect: { tier: needs_approval, rule: default-approval }
  # price_adjustment (product.price_dropped): amount, days since the purchase and the size of the drop decide.
  - name: "a 10 adjustment within 14 days acts alone"
    action: price_adjustment
    facts: { amount: 10, days_since_purchase: 3, drop_percent: 10 }
    expect: { tier: auto, rule: auto-small-adjustment }
  - name: "a 10.01 adjustment is no longer auto but still acts alone with staff told"
    action: price_adjustment
    facts: { amount: 10.01, days_since_purchase: 3, drop_percent: 10 }
    expect: { tier: auto_notify, rule: notify-medium-adjustment }
  - name: "a 20 adjustment on day 14 acts alone and tells staff"
    action: price_adjustment
    facts: { amount: 20, days_since_purchase: 14, drop_percent: 25 }
    expect: { tier: auto_notify, rule: notify-medium-adjustment }
  - name: "a 20.01 adjustment needs approval"
    action: price_adjustment
    facts: { amount: 20.01, days_since_purchase: 3, drop_percent: 25 }
    expect: { tier: needs_approval, rule: default-approval }
  - name: "a purchase on day 15 needs approval even for a tiny amount"
    action: price_adjustment
    facts: { amount: 2, days_since_purchase: 15, drop_percent: 10 }
    expect: { tier: needs_approval, rule: default-approval }
  - name: "a drop over 50 percent looks like a pricing mistake and needs approval"
    action: price_adjustment
    facts: { amount: 5, days_since_purchase: 2, drop_percent: 50.01 }
    expect: { tier: needs_approval, rule: default-approval }
  - name: "a drop of exactly 50 percent is still allowed alone"
    action: price_adjustment
    facts: { amount: 5, days_since_purchase: 2, drop_percent: 50 }
    expect: { tier: auto, rule: auto-small-adjustment }
  - name: "an unknown purchase age never acts alone"
    action: price_adjustment
    facts: { amount: 5, drop_percent: 10 }
    expect: { tier: needs_approval, rule: default-approval }
  - name: "an unknown drop size never acts alone"
    action: price_adjustment
    facts: { amount: 5, days_since_purchase: 2 }
    expect: { tier: needs_approval, rule: default-approval }
  # back_in_stock_notice (inventory.back_in_stock): the bound is the audience, there is no money.
  - name: "a notice to 200 customers goes out alone and staff are told"
    action: back_in_stock_notice
    facts: { recipients: 200 }
    expect: { tier: auto_notify, rule: auto-notice }
  - name: "a notice to 201 customers is more than the system may send alone"
    action: back_in_stock_notice
    facts: { recipients: 201 }
    expect: { tier: needs_approval, rule: default-approval }
  - name: "an unknown audience size never goes out alone"
    action: back_in_stock_notice
    facts: {}
    expect: { tier: needs_approval, rule: default-approval }

  # damage_goodwill (order.item_damaged): amount and days since the purchase decide.
  - name: "damage: a 10 remedy within 30 days acts alone"
    action: damage_goodwill
    facts: { amount: 10, days_since_purchase: 30 }
    expect: { tier: auto, rule: auto-small-damage }
  - name: "damage: a 10.01 remedy still acts alone but staff are told"
    action: damage_goodwill
    facts: { amount: 10.01, days_since_purchase: 3 }
    expect: { tier: auto_notify, rule: notify-medium-damage }
  - name: "damage: exactly the 15 cap acts alone and staff are told"
    action: damage_goodwill
    facts: { amount: 15, days_since_purchase: 30 }
    expect: { tier: auto_notify, rule: notify-medium-damage }
  - name: "damage: a 15.01 remedy needs approval"
    action: damage_goodwill
    facts: { amount: 15.01, days_since_purchase: 3 }
    expect: { tier: needs_approval, rule: default-approval }
  - name: "damage: a small remedy reported on day 31 needs approval"
    action: damage_goodwill
    facts: { amount: 5, days_since_purchase: 31 }
    expect: { tier: needs_approval, rule: default-approval }
  - name: "damage: an unknown age never acts alone"
    action: damage_goodwill
    facts: { amount: 5 }
    expect: { tier: needs_approval, rule: default-approval }
  # order_risk_review (order.risk_flagged): the risk score alone decides, and it never acts alone.
  - name: "risk: a score of 0 is low risk, nothing happens"
    action: order_risk_review
    facts: { risk_score: 0 }
    expect: { tier: no_action, rule: risk-low, hold: false }
  - name: "risk: 29 is still low"
    action: order_risk_review
    facts: { risk_score: 29 }
    expect: { tier: no_action, rule: risk-low, hold: false }
  - name: "risk: 30 is the lowest medium, a person reviews, no hold"
    action: order_risk_review
    facts: { risk_score: 30 }
    expect: { tier: needs_approval, rule: risk-medium-review, hold: false }
  - name: "risk: 69 is the highest medium"
    action: order_risk_review
    facts: { risk_score: 69 }
    expect: { tier: needs_approval, rule: risk-medium-review, hold: false }
  - name: "risk: 70 is high, the order is held and a person reviews"
    action: order_risk_review
    facts: { risk_score: 70 }
    expect: { tier: needs_approval, rule: risk-high-hold, hold: true }
  - name: "risk: 100 is high"
    action: order_risk_review
    facts: { risk_score: 100 }
    expect: { tier: needs_approval, rule: risk-high-hold, hold: true }
  - name: "risk: a score that could not be computed asks a person and holds nothing"
    action: order_risk_review
    facts: {}
    expect: { tier: needs_approval, rule: default-approval, hold: false }

budget_cases:
  - name: "an empty budget allows a credit of 5"
    budget: goodwill_credit
    amount: 5
    usage: {}
    expect: { ok: true, tripped: [] }
  - name: "exactly the per-action cap is allowed"
    budget: goodwill_credit
    amount: 25
    usage: {}
    expect: { ok: true, tripped: [] }
  - name: "a cent over the per-action cap trips it (and the per-customer amount cap)"
    budget: goodwill_credit
    amount: 25.01
    usage: {}
    expect: { ok: false, tripped: [per_action_amount, customer_daily_amount] }
  - name: "a customer who already drew today trips the customer count and amount"
    budget: goodwill_credit
    amount: 5
    usage: { customer_count: 1, customer_amount: 24 }
    expect: { ok: false, tripped: [customer_daily_count, customer_daily_amount] }
  - name: "an order already credited trips the per-order count"
    budget: goodwill_credit
    amount: 5
    usage: { order_count: 1 }
    expect: { ok: false, tripped: [order_count] }
  - name: "the 20th global draw of the day is allowed"
    budget: goodwill_credit
    amount: 5
    usage: { global_count: 19, global_amount: 95 }
    expect: { ok: true, tripped: [] }
  - name: "the 21st global draw trips the global count"
    budget: goodwill_credit
    amount: 5
    usage: { global_count: 20, global_amount: 100 }
    expect: { ok: false, tripped: [global_daily_count] }
  - name: "a draw that crosses the global amount cap trips it"
    budget: goodwill_credit
    amount: 5
    usage: { global_count: 3, global_amount: 196 }
    expect: { ok: false, tripped: [global_daily_amount] }
  - name: "a draw landing exactly on the global amount cap is allowed"
    budget: goodwill_credit
    amount: 5
    usage: { global_count: 3, global_amount: 195 }
    expect: { ok: true, tripped: [] }
  - name: "a missing amount is never allowed"
    budget: goodwill_credit
    amount: null
    usage: {}
    expect: { ok: false, tripped: [amount_missing] }
  - name: "price_adjustment: exactly the per-action cap of 20 is allowed"
    budget: price_adjustment
    amount: 20
    usage: {}
    expect: { ok: true, tripped: [] }
  - name: "price_adjustment: a cent over 20 trips the per-action cap"
    budget: price_adjustment
    amount: 20.01
    usage: {}
    expect: { ok: false, tripped: [per_action_amount] }
  - name: "price_adjustment: a customer's 4th adjustment of the day trips the count"
    budget: price_adjustment
    amount: 5
    usage: { customer_count: 3, customer_amount: 15 }
    expect: { ok: false, tripped: [customer_daily_count] }
  - name: "price_adjustment: a customer reaching 40 in a day trips the amount"
    budget: price_adjustment
    amount: 10
    usage: { customer_count: 2, customer_amount: 35 }
    expect: { ok: false, tripped: [customer_daily_amount] }
  - name: "price_adjustment: a 6th adjusted line on one order trips the per-order count"
    budget: price_adjustment
    amount: 5
    usage: { order_count: 5 }
    expect: { ok: false, tripped: [order_count] }
  - name: "price_adjustment: the 51st global draw trips the global count"
    budget: price_adjustment
    amount: 5
    usage: { global_count: 50, global_amount: 100 }
    expect: { ok: false, tripped: [global_daily_count] }

  # Monthly caps (global_per_month): checked beside the day's, exactly at a cap is allowed.
  - name: "month: the 300th draw of the month is allowed"
    budget: goodwill_credit
    amount: 5
    usage: { month_count: 299, month_amount: 1000 }
    expect: { ok: true, tripped: [] }
  - name: "month: the 301st draw of the month trips the monthly count"
    budget: goodwill_credit
    amount: 5
    usage: { month_count: 300, month_amount: 1000 }
    expect: { ok: false, tripped: [global_monthly_count] }
  - name: "month: a draw landing exactly on the 3000 monthly amount is allowed"
    budget: goodwill_credit
    amount: 5
    usage: { month_count: 100, month_amount: 2995 }
    expect: { ok: true, tripped: [] }
  - name: "month: a cent over the monthly amount trips it"
    budget: goodwill_credit
    amount: 5
    usage: { month_count: 100, month_amount: 2995.01 }
    expect: { ok: false, tripped: [global_monthly_amount] }
  - name: "month: a day cap and a month cap can trip together, day first"
    budget: goodwill_credit
    amount: 5
    usage: { global_count: 20, global_amount: 100, month_count: 300, month_amount: 3000 }
    expect: { ok: false, tripped: [global_daily_count, global_monthly_count, global_monthly_amount] }
  - name: "month: the month cap trips even when the day is empty"
    budget: goodwill_credit
    amount: 5
    usage: { global_count: 0, month_count: 300 }
    expect: { ok: false, tripped: [global_monthly_count] }
  - name: "month: price_adjustment's 801st draw trips the monthly count"
    budget: price_adjustment
    amount: 5
    usage: { month_count: 800, month_amount: 100 }
    expect: { ok: false, tripped: [global_monthly_count] }
  - name: "month: price_adjustment's 800th draw is allowed"
    budget: price_adjustment
    amount: 5
    usage: { month_count: 799, month_amount: 100 }
    expect: { ok: true, tripped: [] }
  # damage_goodwill's own caps.
  - name: "damage: exactly the per-action cap of 15 is allowed"
    budget: damage_goodwill
    amount: 15
    usage: {}
    expect: { ok: true, tripped: [] }
  - name: "damage: a cent over 15 trips the per-action cap and the customer amount"
    budget: damage_goodwill
    amount: 15.01
    usage: {}
    expect: { ok: false, tripped: [per_action_amount, customer_daily_amount] }
  - name: "damage: a third remedy on one order trips the per-order count"
    budget: damage_goodwill
    amount: 5
    usage: { order_count: 2 }
    expect: { ok: false, tripped: [order_count] }
  - name: "damage: the 11th global draw of the day trips the daily count"
    budget: damage_goodwill
    amount: 5
    usage: { global_count: 10, global_amount: 50, month_count: 10, month_amount: 50 }
    expect: { ok: false, tripped: [global_daily_count] }
  - name: "damage: the 150th draw of the month is allowed"
    budget: damage_goodwill
    amount: 5
    usage: { month_count: 149, month_amount: 500 }
    expect: { ok: true, tripped: [] }
  - name: "damage: the 151st draw of the month trips the monthly count"
    budget: damage_goodwill
    amount: 5
    usage: { month_count: 150, month_amount: 500 }
    expect: { ok: false, tripped: [global_monthly_count] }
  - name: "damage: landing exactly on the 1200 monthly amount is allowed"
    budget: damage_goodwill
    amount: 5
    usage: { month_count: 100, month_amount: 1195 }
    expect: { ok: true, tripped: [] }
  - name: "damage: a cent over the monthly amount trips it"
    budget: damage_goodwill
    amount: 5
    usage: { month_count: 100, month_amount: 1195.01 }
    expect: { ok: false, tripped: [global_monthly_amount] }

credit_cases:
  - { delay_days: 0, credit: null }
  - { delay_days: 1, credit: null }
  - { delay_days: 2, credit: 5.00 }
  - { delay_days: 4, credit: 5.00 }
  - { delay_days: 5, credit: 15.00 }
  - { delay_days: 9, credit: 15.00 }
  - { delay_days: 10, credit: 40.00 }
  - { delay_days: 90, credit: 40.00 }

risk_score_cases:
  - { name: "no signals", facts: {}, score: 0 }
  - { name: "an order just under 500", facts: { order_total: 499.99 }, score: 0 }
  - { name: "an order of exactly 500", facts: { order_total: 500 }, score: 20 }
  - { name: "an order just under 1500", facts: { order_total: 1499.99 }, score: 20 }
  - { name: "an order of exactly 1500 adds both size signals", facts: { order_total: 1500 }, score: 40 }
  - { name: "a 6 day old account is new", facts: { account_age_days: 6 }, score: 25 }
  - { name: "a 7 day old account is not new", facts: { account_age_days: 7 }, score: 0 }
  - { name: "billing differs from shipping", facts: { address_mismatch: 1 }, score: 15 }
  - { name: "billing matches shipping", facts: { address_mismatch: 0 }, score: 0 }
  - { name: "an unknown address comparison adds nothing", facts: { address_mismatch: null }, score: 0 }
  - { name: "7 items", facts: { items_count: 7 }, score: 0 }
  - { name: "8 items", facts: { items_count: 8 }, score: 15 }
  - { name: "2 orders in the window", facts: { orders_in_window: 2 }, score: 0 }
  - { name: "3 orders in the window", facts: { orders_in_window: 3 }, score: 25 }
  - { name: "4 orders in the window", facts: { orders_in_window: 4 }, score: 25 }
  - { name: "5 orders in the window add the second velocity signal", facts: { orders_in_window: 5 }, score: 40 }
  - { name: "large order, new account, 3 orders a day: exactly the high threshold", facts: { order_total: 600, account_age_days: 1, orders_in_window: 3 }, score: 70 }
  - { name: "one point under high", facts: { order_total: 1500, account_age_days: 1 }, score: 65 }
  - { name: "everything at once is capped at 100", facts: { order_total: 2000, account_age_days: 1, address_mismatch: 1, items_count: 10, orders_in_window: 6 }, score: 100 }

damage_cases:
  - { name: "a 30.00 item in stock is replaced", value: 30.00, in_stock: true, resolution: replacement_offer, amount: 30.00 }
  - { name: "30.01 is no longer replaced, it earns 20 percent", value: 30.01, in_stock: true, resolution: credit, amount: 6.00 }
  - { name: "a 30.00 item out of stock earns a credit", value: 30.00, in_stock: false, resolution: credit, amount: 6.00 }
  - { name: "a 100.00 item earns the 15.00 cap", value: 100.00, in_stock: true, resolution: credit, amount: 15.00 }
  - { name: "75.00 earns exactly the cap", value: 75.00, in_stock: false, resolution: credit, amount: 15.00 }
  - { name: "75.05 is held at the cap", value: 75.05, in_stock: false, resolution: credit, amount: 15.00 }
  - { name: "2.50 out of stock earns 0.50", value: 2.50, in_stock: false, resolution: credit, amount: 0.50 }
  - { name: "0.03 out of stock rounds half up to 0.01", value: 0.03, in_stock: false, resolution: credit, amount: 0.01 }
  - { name: "0.02 out of stock earns nothing", value: 0.02, in_stock: false, resolution: null, amount: null }
  - { name: "a zero value earns nothing even in stock", value: 0.00, in_stock: true, resolution: null, amount: null }

month_cases:
  - { day: "2026-01-01", start: "2026-01-01", next: "2026-02-01" }
  - { day: "2026-01-31", start: "2026-01-01", next: "2026-02-01" }
  - { day: "2026-02-01", start: "2026-02-01", next: "2026-03-01" }
  - { day: "2028-02-29", start: "2028-02-01", next: "2028-03-01" }
  - { day: "2026-12-31", start: "2026-12-01", next: "2027-01-01" }
