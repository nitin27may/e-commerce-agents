# Site configuration for https://nitinksingh.com/e-commerce-agents/
#
# Kept deliberately close to the sibling repos (clean-architecture-docker-dotnet-angular,
# mean-docker) so the three sites read as one family. Two keys differ, and both
# are load-bearing here in a way they are not there — see `mermaid` and the note
# on generated sources below.
#
# NOTE: the published site is NOT this folder. `scripts/build_docs_site.py`
# assembles `_site_src/` from docs/, docs/concepts/ and tutorials/, and the
# workflow builds that. This file is copied in verbatim as its config. The repo
# tree stays free of Jekyll front matter, which is the whole point: front matter
# renders as a metadata table when the same file is read on GitHub, and every
# page here already carries its title as an H1.

title: E-Commerce Agents
description: Multi-agent orchestration with Microsoft Agent Framework — concepts, 34 tutorial chapters, and a running reference implementation in Python and .NET.
remote_theme: just-the-docs/just-the-docs

# `url` is the origin ONLY. The project path lives in `baseurl`.
# Putting the path in `url` doubles it into everything absolute: jekyll-seo-tag
# canonicals, og:url, and every <loc> jekyll-sitemap emits. All 85 sitemap URLs
# were coming out as /e-commerce-agents/e-commerce-agents/... and 404ing, which
# made the sitemap added below worse than useless.
#
# `baseurl` is set explicitly for the same reason as `repository` below: in CI
# actions/configure-pages injects it, but the generator rewrites every internal
# link to `{{ site.baseurl }}/...`, so a local build without it produces a site
# whose links all point at the domain root.
url: https://nitinksingh.com
baseurl: /e-commerce-agents

# Set explicitly, unlike the sibling repos, so the site can be built locally.
# In CI `actions/configure-pages` injects this; without it jekyll-github-metadata
# aborts with `"" is invalid as a repository identifier`, which is a confusing
# way to be told "you are not running inside Actions".
repository: nitin27may/e-commerce-agents

# Mermaid. Neither sibling repo needs this key; this one has 71 diagrams (37 in
# docs/, 34 across the tutorials), so getting it wrong silently turns the most
# distinctive thing about these docs into 71 raw code blocks. Setting the
# version here is what makes fenced ```mermaid blocks render — no per-page front
# matter required. Pinned rather than floating: a major Mermaid release can
# change diagram syntax under a site nobody is watching.
mermaid:
  version: "10.9.1"

# Search
search_enabled: true
search_tokenizer_separator: /[\s/]+/
search:
  # Chapters are long and heavily sub-headed, so index down to h3 and show a
  # few previews — a hit on "checkpoint" is only useful if the result says
  # which section of which chapter it landed in.
  heading_level: 3
  previews: 3

# Aux links for the upper right navigation
# Top-right on every page. "Run it" is first on purpose: the most common
# reason someone opens these docs is to get the thing running, and burying
# that behind a section click is the difference between trying it and not.
aux_links:
  "Run it":
    - "/e-commerce-agents/getting-started/quick-start.html"
  "View on GitHub":
    - "//github.com/nitin27may/e-commerce-agents"
  # This site had no link out of it anywhere -- not to the blog it is published
  # under, not to its sibling doc sites. Search Console had it as "URL is unknown
  # to Google": never crawled once, because nothing on the web pointed here.
  "nitinksingh.com":
    - "/"

# Site-wide footer. Identical on all four doc sites by design, so the family
# reads as one property rather than four unrelated microsites -- keep it
# byte-identical when editing.
#
# It lives in the footer rather than only in aux_links because the footer
# renders on EVERY page, while aux_links reads as chrome and is easy to miss.
# Raw HTML is safe: the theme interpolates this without escaping (verified
# against live output -- `&copy;` arrives as an entity, not `&amp;copy;`).
#
# Sibling doc-site links are deliberately NOT here; they live in
# nav_external_links below, which is per-site and can differ freely.
footer_content: '&copy; 2026 <a href="https://nitinksingh.com/">Nitin Singh</a> &middot; MIT License &middot; <a href="https://github.com/nitin27may" title="GitHub profile" aria-label="GitHub profile"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true" style="vertical-align:text-bottom"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>'

color_scheme: light
heading_anchors: true

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    color: blue
  new:
    color: green
  note:
    color: purple
  warning:
    color: red

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# "Edit this page on GitHub" is deliberately OFF. The site is generated, so the
# theme's edit link would point at a path that does not exist in the repo.
# Every page instead carries a generated "View source" line pointing at the real
# file, which build_docs_site.py emits.
gh_edit_link: false

# Both sit under nitinksingh.com, so these are same-domain internal links —
# they carry real ranking signal, not just navigation. The hub is the layer
# *below* this site: it teaches the ideas from first principles with local,
# free labs, and its modules already link into this repo for "the same idea in
# production". This is the return half of that pair, which was missing
# everywhere except the 14 concept pages.
nav_external_links:
  - title: AI Knowledge Hub — learn the fundamentals
    url: https://nitinksingh.com/ai-resources/
    hide_icon: false
  - title: E-Commerce Agents on GitHub
    url: https://github.com/nitin27may/e-commerce-agents
    hide_icon: false
  # The sibling doc sites, all published under the same domain. Trailing slashes
  # are required: GitHub Pages 301s the unslashed form of a directory index.
  # AI Knowledge Hub is deliberately absent here -- it is already the first entry
  # above, with a fuller label. It was listed twice, pointing at the same URL.
  - title: Clean Architecture Starter
    url: https://nitinksingh.com/clean-architecture-docker-dotnet-angular/
    hide_icon: false
  - title: MEAN Stack with Docker
    url: https://nitinksingh.com/mean-docker/
    hide_icon: false

back_to_top: true
back_to_top_text: "Back to top"

collapse_inactive_chapters: true
enable_copy_code_button: true

# Same Google Analytics property as nitinksingh.com and the AI Knowledge Hub.
# All three sites share one domain, so they share one data stream -- a reader
# going from a blog post to a tutorial here is one session with a journey,
# not two. Separate per-site reporting is a path filter on /e-commerce-agents/,
# not a second property.
#
# This key was missing while ga_tracking_anonymize_ip was already set, and
# just-the-docs only emits the gtag block `{% if site.ga_tracking != nil %}`,
# so the site was live looking configured and collecting nothing.
ga_tracking: G-5Z8HS51RCP
ga_tracking_anonymize_ip: true

# Default social-preview image. jekyll-seo-tag emits og:image and
# twitter:image from this, and upgrades the card to a banner rather than a
# thumbnail — so a link shared to Slack, LinkedIn or X shows the agent
# timeline instead of a bare grey box.
#
# This MUST go through `defaults`, not a bare top-level `image:` key. It was
# written as a top-level key first, and that silently did nothing: all 85 pages
# still shipped with no og:image. jekyll-seo-tag's ImageDrop reads
# `page["image"]` and has no `site["image"]` fallback, so a site-level key is
# never consulted. `defaults` is what injects the value into every page's front
# matter, which is the thing ImageDrop actually reads — and it is exactly what
# the sibling sites (mean-docker, clean-architecture) already do.
#
# Must be an absolute URL. jekyll-seo-tag does not prepend `baseurl` to a
# root-relative image path, so a bare `/docs/images/...` would resolve
# against the domain root and 404 — the same drop-vs-double trap that made
# every sitemap URL wrong before it was fixed. The `docs/` segment is real:
# build_docs_site.py copies docs/images to _site_src/docs/images, preserving
# the prefix.
defaults:
  - scope:
      path: ""
    values:
      image: https://nitinksingh.com/e-commerce-agents/docs/images/agent-timeline.png

twitter:
  card: summary_large_image

# The site had no sitemap.xml at all, which left all 85 generated pages
# undiscoverable -- nothing for Search Console to submit and nothing for a
# crawler to walk. jekyll-sitemap is on the GitHub Pages plugin whitelist, so
# it runs under actions/jekyll-build-pages without a Gemfile.
plugins:
  - jekyll-sitemap
